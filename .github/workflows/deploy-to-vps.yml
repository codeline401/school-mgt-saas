name: Deploy frontend to VPS

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build app
        run: |
          cd apps/web
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.APIVPSFUTURECOLE }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H srv1725405.hstgr.cloud >> ~/.ssh/known_hosts
      
      - name: Test SSH
        run: ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes root@srv1725405.hstgr.cloud "echo OK"      
            
      - name: Sync files to VPS
        run: |
                rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            apps/web/dist/ \
            root@srv1725405.hstgr.cloud:/var/www/school-web/
