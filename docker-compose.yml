version: "3.9"

services:
  # ---------------- DATABASE ----------------
  db:
    image: postgres:15-alpine
    container_name: school_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  # ---------------- REDIS ----------------
  redis:
    image: redis:alpine
    container_name: school_redis
    restart: always
    ports:
      - "6379:6379"

  # ---------------- PGADMIN ----------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: school_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - db

  # ---------------- API (NODE + TYPESCRIPT + PRISMA) ----------------
  api:
    build:
      context: .                          # 👈 IMPORTANT (monorepo complet)
      dockerfile: apps/api/Dockerfile    # 👈 chemin du Dockerfile
    container_name: school_api
    restart: always
    depends_on:
      - db
      - redis
        #env_file:
      #  - ./apps/api/.env    
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "5000:5000"
